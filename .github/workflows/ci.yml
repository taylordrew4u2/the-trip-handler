name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # Real Postgres so we can actually apply migrations and detect schema drift,
    # rather than trusting that the committed SQL is correct.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trip_handler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_handler_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # Validates that the committed migrations apply cleanly to a fresh DB —
        # the same `prisma migrate deploy` that runs on deploy.
        run: npx prisma migrate deploy

      - name: Check for migration drift
        # Fails if prisma/schema.prisma has changes that aren't captured by a
        # migration, so schema and migrations can never silently diverge.
        run: >-
          npx prisma migrate diff
          --from-schema-datamodel prisma/schema.prisma
          --to-url "$DATABASE_URL"
          --exit-code
          || (echo "::error::schema.prisma has changes with no matching migration. Run 'prisma migrate dev' and commit the result." && exit 1)

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Run `next build` directly to catch build-time breakage before it
        # reaches Vercel. (Deploys run the full `npm run build`, which also
        # applies migrations via scripts/db-deploy.sh.)
        run: npx next build
        env:
          NEXTAUTH_SECRET: ci-dummy-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: responsive e2e
    runs-on: ubuntu-latest

    # The responsive suite asserts real layout at real widths, so it needs a
    # production build serving real data — not a mocked render.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trip_handler_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_handler_e2e
      NEXTAUTH_SECRET: ci-dummy-secret
      NEXTAUTH_URL: http://127.0.0.1:3222
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3222

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        # The suite signs in as the seeded organizer and member to reach the
        # pages behind auth.
        run: npm run db:seed

      - name: Build
        run: npx next build

      - name: Install Playwright browser
        # Chromium only — see the note in playwright.config.ts on why this
        # suite runs on a single engine.
        run: npx playwright install --with-deps chromium

      - name: Run responsive suite
        # Playwright starts the built app itself (see `webServer` in the config).
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
