<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="560" fill="#fafaf9"/>

  <!-- Nav bar -->
  <rect width="900" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e7e5e3" stroke-width="1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#1c1917">The Trip Handler</text>
  <text x="206" y="33" font-size="12" fill="#57534e">Home</text>
  <text x="254" y="33" font-size="12" fill="#57534e">My trips</text>
  <text x="314" y="33" font-size="12" fill="#57534e">Roster</text>
  <text x="366" y="33" font-size="12" fill="#57534e">Itinerary</text>
  <text x="427" y="33" font-size="12" fill="#57534e">Lodging</text>
  <rect x="474" y="16" width="58" height="26" rx="6" fill="#1c1917"/>
  <text x="503" y="33" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Sleeping</text>
  <text x="545" y="33" font-size="12" fill="#57534e">Meals</text>
  <text x="592" y="33" font-size="12" fill="#57534e">Board</text>
  <text x="840" y="33" font-size="12" fill="#78716c">Sign out</text>

  <g transform="translate(60, 76)">

    <text x="0" y="30" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#1c1917">Sleeping Arrangements</text>
    <text x="0" y="52" font-size="14" fill="#78716c">Claim a bed or request a bedmate · 3 beds remaining</text>

    <!-- Room: The Loft -->
    <text x="0" y="84" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1c1917">The Loft</text>
    <text x="0" y="102" font-size="11" fill="#a8a29e">Upstairs open loft · 4 beds</text>

    <!-- Bed 1 - Claimed -->
    <rect x="0" y="112" width="178" height="100" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <rect x="0" y="112" width="178" height="4" rx="2" fill="#d6d3d1"/>
    <text x="12" y="134" font-size="10" font-weight="600" fill="#78716c" letter-spacing="1">QUEEN BED A</text>
    <circle cx="36" cy="162" r="16" fill="#e7e5e3"/>
    <text x="36" y="167" font-size="11" font-weight="600" fill="#57534e" text-anchor="middle">P</text>
    <text x="58" y="158" font-size="11" font-weight="600" fill="#1c1917">Priya K.</text>
    <text x="58" y="173" font-size="10" fill="#78716c">light sleeper</text>
    <rect x="12" y="188" width="50" height="16" rx="8" fill="#f5f5f4" stroke="#e7e5e3" stroke-width="1"/>
    <text x="37" y="199" font-size="9" fill="#57534e" text-anchor="middle">Request →</text>

    <!-- Bed 2 - Empty (available) -->
    <rect x="194" y="112" width="178" height="100" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="206" y="134" font-size="10" font-weight="600" fill="#78716c" letter-spacing="1">QUEEN BED B</text>
    <text x="283" y="162" font-size="28" fill="#e7e5e3" text-anchor="middle">+</text>
    <text x="283" y="182" font-size="11" fill="#a8a29e" text-anchor="middle">Available</text>
    <rect x="206" y="188" width="62" height="16" rx="8" fill="#1c1917"/>
    <text x="237" y="199" font-size="9" fill="#ffffff" text-anchor="middle">Claim bed →</text>

    <!-- Bed 3 - Claimed (two people) -->
    <rect x="388" y="112" width="178" height="100" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <rect x="388" y="112" width="178" height="4" rx="2" fill="#d6d3d1"/>
    <text x="400" y="134" font-size="10" font-weight="600" fill="#78716c" letter-spacing="1">KING BED</text>
    <circle cx="416" cy="162" r="15" fill="#e7e5e3"/>
    <text x="416" y="167" font-size="11" font-weight="600" fill="#57534e" text-anchor="middle">M</text>
    <circle cx="444" cy="162" r="15" fill="#e7e5e3"/>
    <text x="444" y="167" font-size="11" font-weight="600" fill="#57534e" text-anchor="middle">J</text>
    <text x="468" y="157" font-size="11" font-weight="600" fill="#1c1917">Marcus &amp; Jordan</text>
    <text x="468" y="172" font-size="10" fill="#78716c">confirmed bedmates</text>
    <rect x="400" y="188" width="36" height="16" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="418" y="199" font-size="9" fill="#166534" text-anchor="middle">Full</text>

    <!-- Bed 4 - Women only -->
    <rect x="582" y="112" width="198" height="100" rx="10" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <rect x="582" y="112" width="198" height="4" rx="2" fill="#c084fc"/>
    <text x="594" y="134" font-size="10" font-weight="600" fill="#7e22ce" letter-spacing="1">TWIN BED · WOMEN ONLY</text>
    <circle cx="610" cy="162" r="15" fill="#f3e8ff"/>
    <text x="610" y="167" font-size="11" font-weight="600" fill="#7e22ce" text-anchor="middle">S</text>
    <text x="632" y="158" font-size="11" font-weight="600" fill="#1c1917">Sam R.</text>
    <text x="632" y="173" font-size="10" fill="#78716c">early riser, no snoring</text>
    <rect x="594" y="188" width="44" height="16" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="616" y="199" font-size="9" fill="#7e22ce" text-anchor="middle">Request →</text>

    <!-- Room: Cabin -->
    <text x="0" y="234" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1c1917">The Cabin</text>
    <text x="0" y="252" font-size="11" fill="#a8a29e">Detached cabin · 2 beds</text>

    <rect x="0" y="262" width="178" height="100" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <rect x="0" y="262" width="178" height="4" rx="2" fill="#d6d3d1"/>
    <text x="12" y="284" font-size="10" font-weight="600" fill="#78716c" letter-spacing="1">DOUBLE BED A</text>
    <text x="89" y="322" font-size="28" fill="#e7e5e3" text-anchor="middle">+</text>
    <text x="89" y="342" font-size="11" fill="#a8a29e" text-anchor="middle">Available</text>
    <rect x="12" y="348" width="62" height="16" rx="8" fill="#1c1917"/>
    <text x="43" y="359" font-size="9" fill="#ffffff" text-anchor="middle">Claim bed →</text>

    <rect x="194" y="262" width="178" height="100" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <rect x="194" y="262" width="178" height="4" rx="2" fill="#d6d3d1"/>
    <text x="206" y="284" font-size="10" font-weight="600" fill="#78716c" letter-spacing="1">DOUBLE BED B</text>
    <text x="283" y="322" font-size="28" fill="#e7e5e3" text-anchor="middle">+</text>
    <text x="283" y="342" font-size="11" fill="#a8a29e" text-anchor="middle">Available</text>
    <rect x="206" y="348" width="62" height="16" rx="8" fill="#1c1917"/>
    <text x="237" y="359" font-size="9" fill="#ffffff" text-anchor="middle">Claim bed →</text>

    <!-- Bedmate requests panel -->
    <rect x="390" y="262" width="390" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="406" y="284" font-size="10" font-weight="600" fill="#92400e" letter-spacing="1.5">INCOMING BEDMATE REQUEST</text>
    <circle cx="422" cy="318" r="15" fill="#fde68a"/>
    <text x="422" y="323" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">A</text>
    <text x="444" y="312" font-size="13" font-weight="600" fill="#1c1917">Alex wants to share your bed</text>
    <text x="444" y="329" font-size="11" fill="#78716c">Cabin Double Bed B · quiet sleeper</text>
    <rect x="406" y="344" width="54" height="16" rx="8" fill="#1c1917"/>
    <text x="433" y="355" font-size="9" fill="#ffffff" text-anchor="middle">Accept →</text>
    <rect x="468" y="344" width="52" height="16" rx="8" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="494" y="355" font-size="9" fill="#57534e" text-anchor="middle">Decline</text>

  </g>
</svg>
