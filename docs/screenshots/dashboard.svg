<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="540" fill="#fafaf9"/>

  <!-- Nav bar -->
  <rect width="900" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e7e5e3" stroke-width="1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#1c1917">The Trip Handler</text>
  <!-- Nav items -->
  <rect x="206" y="16" width="46" height="26" rx="6" fill="#1c1917"/>
  <text x="229" y="33" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Home</text>
  <text x="276" y="33" font-size="12" font-weight="500" fill="#57534e">My trips</text>
  <text x="336" y="33" font-size="12" font-weight="500" fill="#57534e">Roster</text>
  <text x="388" y="33" font-size="12" font-weight="500" fill="#57534e">Itinerary</text>
  <text x="449" y="33" font-size="12" font-weight="500" fill="#57534e">Lodging</text>
  <text x="508" y="33" font-size="12" font-weight="500" fill="#57534e">Sleeping</text>
  <text x="565" y="33" font-size="12" font-weight="500" fill="#57534e">Meals</text>
  <text x="612" y="33" font-size="12" font-weight="500" fill="#57534e">Board</text>
  <text x="840" y="33" font-size="12" font-weight="500" fill="#78716c">Sign out</text>

  <!-- Page content container -->
  <g transform="translate(60, 76)">

    <!-- Dark hero header -->
    <rect x="0" y="0" width="780" height="188" rx="16" fill="#1c1917"/>
    <text x="20" y="28" font-size="10" font-weight="500" fill="#a8a29e" letter-spacing="3">THE ROSTER</text>
    <text x="20" y="72" font-family="Georgia, serif" font-size="38" font-weight="600" fill="#f5f5f4">Blue Ridge Mountain Retreat</text>
    <text x="20" y="104" font-size="14" fill="#d6d3d1">Asheville, NC · August 14 – 18, 2025</text>

    <!-- Stat cards -->
    <rect x="20" y="122" width="90" height="54" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="65" y="147" font-size="22" font-weight="600" fill="#f5f5f4" text-anchor="middle">14</text>
    <text x="65" y="165" font-size="9" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="1.5">APPROVED</text>

    <rect x="122" y="122" width="90" height="54" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="167" y="147" font-size="22" font-weight="600" fill="#f5f5f4" text-anchor="middle">9</text>
    <text x="167" y="165" font-size="9" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="1.5">CONFIRMED</text>

    <rect x="224" y="122" width="90" height="54" rx="8" fill="#14532d" stroke="#15803d" stroke-width="1" fill-opacity="0.5"/>
    <text x="269" y="147" font-size="16" font-weight="600" fill="#6ee7b7" text-anchor="middle">Locked</text>
    <text x="269" y="165" font-size="9" font-weight="500" fill="#6ee7b7" text-anchor="middle" fill-opacity="0.8" letter-spacing="1.5">STATUS</text>

    <!-- Next step card (blue) -->
    <rect x="0" y="204" width="780" height="94" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="226" font-size="9" font-weight="600" fill="#1e40af" letter-spacing="2">NEXT STEP</text>
    <text x="20" y="252" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#1c1917">Fill out your trip preferences</text>
    <text x="20" y="273" font-size="12" fill="#44403c">Now that you're approved, share your transportation, food, and activity preferences.</text>
    <rect x="20" y="282" width="168" height="6" rx="3" fill="#e7e5e3"/>

    <!-- Welcome card -->
    <rect x="0" y="314" width="780" height="80" rx="12" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="20" y="342" font-size="14" font-weight="500" fill="#1c1917">Welcome back, Jordan.</text>
    <text x="20" y="363" font-size="13" fill="#78716c">You're confirmed for Blue Ridge. Payment has been received — see you there.</text>
    <text x="20" y="382" font-size="12" fill="#a8a29e">Check the itinerary for the latest schedule updates →</text>

    <!-- Quick links grid -->
    <rect x="0" y="410" width="246" height="80" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="16" y="437" font-size="12" font-weight="600" fill="#1c1917">Meal Poll</text>
    <text x="16" y="456" font-size="11" fill="#78716c">Voting closes Friday · 14 votes in</text>
    <rect x="16" y="466" width="80" height="14" rx="7" fill="#f5f5f4" stroke="#e7e5e3" stroke-width="1"/>
    <text x="56" y="477" font-size="10" fill="#57534e" text-anchor="middle">Cast your vote →</text>

    <rect x="258" y="410" width="246" height="80" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="274" y="437" font-size="12" font-weight="600" fill="#1c1917">Sleeping Arrangements</text>
    <text x="274" y="456" font-size="11" fill="#78716c">3 beds remaining · Loft and cabin</text>
    <rect x="274" y="466" width="72" height="14" rx="7" fill="#f5f5f4" stroke="#e7e5e3" stroke-width="1"/>
    <text x="310" y="477" font-size="10" fill="#57534e" text-anchor="middle">Claim a bed →</text>

    <rect x="516" y="410" width="264" height="80" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="532" y="437" font-size="12" font-weight="600" fill="#1c1917">Contributions</text>
    <text x="532" y="456" font-size="11" fill="#78716c">2 items still unclaimed · Speakers, Wine</text>
    <rect x="532" y="466" width="68" height="14" rx="7" fill="#f5f5f4" stroke="#e7e5e3" stroke-width="1"/>
    <text x="566" y="477" font-size="10" fill="#57534e" text-anchor="middle">Sign up →</text>

  </g>
</svg>
