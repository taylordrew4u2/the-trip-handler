<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="560" fill="#fafaf9"/>

  <!-- Nav bar -->
  <rect width="900" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e7e5e3" stroke-width="1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#1c1917">The Trip Handler</text>
  <text x="206" y="33" font-size="12" font-weight="500" fill="#57534e">Home</text>
  <text x="254" y="33" font-size="12" font-weight="500" fill="#57534e">My trips</text>
  <text x="314" y="33" font-size="12" font-weight="500" fill="#57534e">Roster</text>
  <text x="366" y="33" font-size="12" font-weight="500" fill="#57534e">Itinerary</text>
  <text x="427" y="33" font-size="12" font-weight="500" fill="#57534e">Lodging</text>
  <text x="486" y="33" font-size="12" font-weight="500" fill="#57534e">Sleeping</text>
  <rect x="536" y="16" width="44" height="26" rx="6" fill="#1c1917"/>
  <text x="558" y="33" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Meals</text>
  <text x="600" y="33" font-size="12" font-weight="500" fill="#57534e">Board</text>
  <text x="840" y="33" font-size="12" font-weight="500" fill="#78716c">Sign out</text>

  <g transform="translate(60, 76)">

    <!-- Page header -->
    <text x="0" y="30" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#1c1917">Meal Planning</text>
    <text x="0" y="52" font-size="14" fill="#78716c">Vote on your favorites · Voting closes Friday at midnight</text>

    <!-- Phase indicator -->
    <rect x="0" y="66" width="780" height="44" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <!-- Phase steps -->
    <circle cx="90" cy="88" r="10" fill="#e7e5e3"/>
    <text x="90" y="92" font-size="10" fill="#78716c" text-anchor="middle">1</text>
    <text x="90" y="106" font-size="9" fill="#78716c" text-anchor="middle">Suggestions</text>
    <line x1="100" y1="88" x2="250" y2="88" stroke="#e7e5e3" stroke-width="2"/>
    <circle cx="260" cy="88" r="10" fill="#1c1917"/>
    <text x="260" y="92" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
    <text x="260" y="106" font-size="9" font-weight="600" fill="#1c1917" text-anchor="middle">Voting</text>
    <line x1="270" y1="88" x2="420" y2="88" stroke="#e7e5e3" stroke-width="2"/>
    <circle cx="430" cy="88" r="10" fill="#e7e5e3"/>
    <text x="430" y="92" font-size="10" fill="#78716c" text-anchor="middle">3</text>
    <text x="430" y="106" font-size="9" fill="#78716c" text-anchor="middle">Finalization</text>
    <line x1="440" y1="88" x2="590" y2="88" stroke="#e7e5e3" stroke-width="2"/>
    <circle cx="600" cy="88" r="10" fill="#e7e5e3"/>
    <text x="600" y="92" font-size="10" fill="#78716c" text-anchor="middle">4</text>
    <text x="600" y="106" font-size="9" fill="#78716c" text-anchor="middle">Grocery List</text>

    <!-- Meal slot label -->
    <text x="0" y="138" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1c1917">Saturday Dinner</text>
    <text x="0" y="157" font-size="12" fill="#78716c">6 suggestions · 14 people voted</text>

    <!-- Meal cards - voting UI -->
    <!-- Card 1 (leading) -->
    <rect x="0" y="168" width="374" height="96" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
    <rect x="0" y="168" width="374" height="6" rx="5" fill="#1c1917"/>
    <text x="16" y="198" font-size="14" font-weight="600" fill="#1c1917">Shrimp tacos with mango slaw</text>
    <text x="16" y="216" font-size="11" fill="#78716c">Suggested by Priya · cook: Priya + Marcus</text>
    <rect x="16" y="225" width="40" height="16" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="36" y="236" font-size="9" fill="#92400e" text-anchor="middle">GF</text>
    <rect x="62" y="225" width="68" height="16" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="96" y="236" font-size="9" fill="#166534" text-anchor="middle">dairy-free</text>
    <!-- Vote bar -->
    <rect x="16" y="248" width="340" height="6" rx="3" fill="#e7e5e3"/>
    <rect x="16" y="248" width="238" height="6" rx="3" fill="#1c1917"/>
    <text x="360" y="256" font-size="10" font-weight="600" fill="#1c1917" text-anchor="end">11 votes</text>

    <!-- Card 2 -->
    <rect x="390" y="168" width="390" height="96" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="406" y="198" font-size="14" font-weight="600" fill="#1c1917">Grilled salmon with roasted veg</text>
    <text x="406" y="216" font-size="11" fill="#78716c">Suggested by Devon · cook: Devon</text>
    <rect x="406" y="225" width="66" height="16" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="439" y="236" font-size="9" fill="#166534" text-anchor="middle">gluten-free</text>
    <!-- Vote bar -->
    <rect x="406" y="248" width="360" height="6" rx="3" fill="#e7e5e3"/>
    <rect x="406" y="248" width="144" height="6" rx="3" fill="#44403c"/>
    <text x="770" y="256" font-size="10" font-weight="600" fill="#44403c" text-anchor="end">8 votes</text>

    <!-- Card 3 -->
    <rect x="0" y="276" width="374" height="96" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="16" y="306" font-size="14" font-weight="600" fill="#1c1917">Homemade pizza night</text>
    <text x="16" y="324" font-size="11" fill="#78716c">Suggested by Sam · cook: group effort</text>
    <rect x="16" y="333" width="66" height="16" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="49" y="344" font-size="9" fill="#7e22ce" text-anchor="middle">vegetarian</text>
    <rect x="88" y="333" width="50" height="16" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
    <text x="113" y="344" font-size="9" fill="#713f12" text-anchor="middle">vegan opt</text>
    <rect x="16" y="356" width="340" height="6" rx="3" fill="#e7e5e3"/>
    <rect x="16" y="356" width="100" height="6" rx="3" fill="#44403c"/>
    <text x="360" y="364" font-size="10" font-weight="600" fill="#44403c" text-anchor="end">6 votes</text>

    <!-- Card 4 -->
    <rect x="390" y="276" width="390" height="96" rx="10" fill="#ffffff" stroke="#e7e5e3" stroke-width="1"/>
    <text x="406" y="306" font-size="14" font-weight="600" fill="#1c1917">Korean BBQ spread</text>
    <text x="406" y="324" font-size="11" fill="#78716c">Suggested by Alex · cook: Alex + Jordan</text>
    <rect x="406" y="333" width="36" height="16" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="424" y="344" font-size="9" fill="#92400e" text-anchor="middle">GF</text>
    <rect x="406" y="356" width="360" height="6" rx="3" fill="#e7e5e3"/>
    <rect x="406" y="356" width="72" height="6" rx="3" fill="#44403c"/>
    <text x="770" y="364" font-size="10" font-weight="600" fill="#44403c" text-anchor="end">4 votes</text>

    <!-- Your vote button -->
    <rect x="0" y="386" width="780" height="48" rx="10" fill="#f5f5f4" stroke="#e7e5e3" stroke-width="1"/>
    <text x="390" y="406" font-size="13" font-weight="500" fill="#57534e" text-anchor="middle">You voted for: Shrimp tacos with mango slaw</text>
    <text x="390" y="424" font-size="11" fill="#a8a29e" text-anchor="middle">Change your vote before Friday midnight</text>

  </g>
</svg>
